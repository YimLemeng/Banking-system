services:
  postgres:
    image: postgres:17-alpine
    container_name: banking_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-banking_system_db}
      POSTGRES_USER: ${DB_USER:-banking_system}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-banking_system} -d ${DB_NAME:-banking_system_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - banking_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banking_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-banking_system_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-banking_system}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    networks:
      - banking_network

volumes:
  postgres_data:
    driver: local

networks:
  banking_network:
    driver: bridge
